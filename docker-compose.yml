# =============================================================================
# Auto-Wish AI — Docker Compose (Development)
# =============================================================================
#
# QUICK START:
#   1. copy .env.example .env      (Windows)
#      cp   .env.example .env      (Linux / macOS)
#   2. Edit .env — fill in SECRET_KEY, DB_PASSWORD, AI API keys, etc.
#   3. docker compose up --build
#
# Services:
#   frontend      → http://localhost:5173  (Vite dev server, hot-reload)
#   backend       → http://localhost:8000  (Django + Gunicorn)
#   postgres      → internal only          (PostgreSQL 15)
#   redis         → internal only          (Redis 7)
#   celery_worker → internal only          (Celery worker)
#   celery_beat   → internal only          (Celery beat — scheduled tasks)
#
# Data persistence:
#   postgres_data volume survives `docker compose down`
#   To WIPE the database:  docker compose down -v
#
# =============================================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: autowish_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Only expose to host for debugging (comment out in production)
    ports:
      - "5432:5432"
    networks:
      - autowish_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: autowish_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # Only expose to host for debugging (comment out in production)
    ports:
      - "6379:6379"
    networks:
      - autowish_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Backend (Django) ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autowish_backend
    restart: unless-stopped
    # entrypoint.sh waits for postgres+redis, runs migrations & collectstatic,
    # then executes this command.
    command: >
      gunicorn autowish.wsgi:application
        --bind 0.0.0.0:8000
        --workers 3
        --timeout 120
        --access-logfile -
        --error-logfile -
    env_file:
      - .env
    environment:
      # Entrypoint control — backend runs both migrations and collectstatic
      RUN_MIGRATIONS: "true"
      RUN_COLLECTSTATIC: "true"
    volumes:
      # Mount source for live code reloading (remove in production)
      - ./backend:/app
      # Named volumes keep static/media outside the container FS
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    networks:
      - autowish_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autowish_celery_worker
    restart: unless-stopped
    command: celery -A autowish worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      # Workers don't need to run migrations or collectstatic
      RUN_MIGRATIONS: "false"
      RUN_COLLECTSTATIC: "false"
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    networks:
      - autowish_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # ── Celery Beat (Scheduler) ─────────────────────────────────────────────────
  # Uses django_celery_beat DatabaseScheduler — schedules stored in PostgreSQL.
  # This handles the daily wish check task (core.tasks.check_daily_wishes_task).
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autowish_celery_beat
    restart: unless-stopped
    command: >
      celery -A autowish beat
        --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      # Beat doesn't run migrations; backend handles that
      RUN_MIGRATIONS: "false"
      RUN_COLLECTSTATIC: "false"
    volumes:
      - ./backend:/app
    networks:
      - autowish_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # ── Frontend (React / Vite dev server) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autowish_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Vite proxy: /api/* → http://backend:8000/api/*
      # This must be the Docker service name, NOT localhost.
      VITE_API_PROXY_TARGET: "http://backend:8000"
      VITE_API_URL: "/api"
    volumes:
      # Mount source for hot-reload; node_modules stays inside the container
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - autowish_net
    depends_on:
      - backend

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  postgres_data:
    name: autowish_postgres_data
  redis_data:
    name: autowish_redis_data
  static_volume:
    name: autowish_static
  media_volume:
    name: autowish_media
  frontend_node_modules:
    name: autowish_frontend_node_modules

# =============================================================================
# Networks
# =============================================================================
networks:
  autowish_net:
    name: autowish_network
    driver: bridge
